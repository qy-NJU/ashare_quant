# Quantitative Pipeline Configuration - 预测下一个交易日

pipeline:
  name: "V4_Inference_Pipeline"
  mode: "predict_only"
  
  data:
    source: "LocalLakeRepository"
    sync_source: "tushare"
    cache_dir: "data/local_lake"
    
    symbols: []
    pool:
      board: "all"
      exchange: "all"
      exclude_st: true
      max_count: 0
      indices: "csi_all"  # 沪深300+中证500+中证1000成分股

  # 预测日期（用最新交易日数据预测 T+1）
  prediction:
    target_date: "2026-05-06"

  # 特征预处理（与训练一致）
  preprocessing:
    dynamic_filter:
      enable: true
      min_avg_turnover: 10000000
      min_listed_days: 120
    mad_clip: true
    z_score: true

  # 特征工程配置（与训练完全一致）
  features:
    - name: "MarketFactor"
      params:
        index_symbol: "sh.000300"
    - name: "SubjectiveFactor"
      params: {}
    - name: "PatternFactor"
      params: {}
    - name: "EventFactor"
      params: {}
    - name: "ReversalFactor"
      params: {}
    - name: "BoardFactor"
      params:
        encode_method: "category"
    - name: "FinancialFactor"
      params: {}
    - name: "FundFlowFactor"
      params: {}
    - name: "PandasTAFactor"
      params:
        strategy: "curated"
    - name: "LabelGenerator"
      params:
        horizon: 7
        target_type: "decay_weighted"

  # 模型（CatBoost 单模型）
  model:
    name: "CatBoostWrapper"
    params:
      loss_function: "RMSE"
      depth: 6
      learning_rate: 0.05
      subsample: 0.8
      l2_leaf_reg: 3.0
      random_seed: 42
    load_path: "models/saved/catboost_single"

  # 策略配置（与回测一致）
  strategy:
    name: "MLStrategy"
    params:
      top_k: 4
      target_position_ratio: 0.6
      rebalance_period: 1
      max_daily_swaps: 1
      weight_method: "inv_vol"
      use_market_filter: false
      max_turnover: 1.0
      atr_stop_mult: 2.5
      atr_daily_drop_mult: 2.0
      atr_trail_mult: 3.0
      take_profit_activate: 0.15
      take_profit_trail: 0.08
    available_capital: 100000.0

  # 当前持仓（空仓则输出新建仓建议）
  portfolio:
    current_positions: {
    }
    position_costs: {
    }
